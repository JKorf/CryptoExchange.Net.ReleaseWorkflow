name: Release script tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Check PowerShell version and script syntax
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion -lt [version]'7.2') { throw 'PowerShell 7.2 or newer is required.' }
          foreach ($file in Get-ChildItem ./scripts -Recurse -Filter '*.ps1' -File) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Test NUnit warning reports
        run: ./scripts/tests/Test-TestWarnings.ps1

      - name: Test release artifacts and recovery
        run: ./scripts/tests/Test-PublishRelease.ps1

      - name: Test HTTP handling
        run: ./scripts/tests/Test-ReleaseHttp.ps1

      - name: Test release input validation
        run: ./scripts/tests/Test-ReleaseValidation.ps1

      - name: Test release preparation orchestration
        run: ./scripts/tests/Test-ReleasePreparation.ps1

      - name: Test final release build orchestration
        run: ./scripts/tests/Test-ReleaseBuild.ps1

      - name: Create a separate sample library
        id: fixture
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ('sample-library-' + [guid]::NewGuid().ToString('N'))
          ./scripts/tests/New-ValidationFixture.ps1 -Directory $directory -Buildable
          git -C $directory remote add origin $directory
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the sample library local origin.' }
          "directory=$directory" >> $env:GITHUB_OUTPUT

      - name: Exercise the shared validation action
        id: validate
        uses: ./actions/validate
        with:
          working-directory: ${{ steps.fixture.outputs.directory }}
          selected-ref: refs/heads/main
          version: 1.3.1
          notes: |
            - Feature 1
              - Nested detail
            - Feature 2

      - name: Exercise major-version approval detection
        id: major
        uses: ./actions/validate
        with:
          working-directory: ${{ steps.fixture.outputs.directory }}
          selected-ref: refs/heads/main
          version: 2.0.0
          notes: '- Breaking API update'
          override-reason: Breaking API update in the sample library

      - name: Verify composite action outputs and unchanged source
        env:
          NORMAL_APPROVAL: ${{ steps.validate.outputs.requires_approval }}
          MAJOR_APPROVAL: ${{ steps.major.outputs.requires_approval }}
          RELEASE_BRANCH: ${{ steps.validate.outputs.branch }}
          BODY_PATH: ${{ steps.validate.outputs.body_path }}
          PLAN_PATH: ${{ steps.validate.outputs.plan_path }}
          FIXTURE_PATH: ${{ steps.fixture.outputs.directory }}
        run: |
          if ($env:NORMAL_APPROVAL -ne 'false' -or $env:MAJOR_APPROVAL -ne 'true') { throw 'Incorrect approval outputs.' }
          if ($env:RELEASE_BRANCH -ne 'release/example/1.3.1') { throw 'Incorrect branch output.' }
          if (-not (Get-Content -LiteralPath $env:BODY_PATH -Raw).Contains("- Feature 1`n  - Nested detail")) { throw 'Release notes did not retain indentation.' }
          $plan = Get-Content -LiteralPath $env:PLAN_PATH -Raw | ConvertFrom-Json
          if ($plan.package_id -ne 'Example' -or $plan.version -ne '1.3.1') { throw 'Incorrect plan outputs.' }
          $changes = git -C $env:FIXTURE_PATH status --porcelain
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Validation modified the sample library.' }

      - name: Exercise the shared preparation action
        id: prepare
        uses: ./actions/prepare
        with:
          working-directory: ${{ steps.fixture.outputs.directory }}
          selected-ref: refs/heads/main
          version: 1.3.1
          notes: |
            - Feature 1
              - Nested detail
            - Feature 2
          artifact-name: sample-preparation-${{ matrix.os }}

      - name: Verify preparation changes and PR content
        env:
          BODY_PATH: ${{ steps.prepare.outputs.body_path }}
          PLAN_PATH: ${{ steps.prepare.outputs.plan_path }}
          WARNINGS_PATH: ${{ steps.prepare.outputs.warnings_path }}
          FIXTURE_PATH: ${{ steps.fixture.outputs.directory }}
        run: |
          $plan = Get-Content -LiteralPath $env:PLAN_PATH -Raw | ConvertFrom-Json
          $project = [xml](Get-Content (Join-Path $env:FIXTURE_PATH $plan.project) -Raw)
          if ($project.Project.PropertyGroup.PackageVersion -ne '1.3.1') { throw 'Preparation did not update version.' }
          $readme = (Get-Content (Join-Path $env:FIXTURE_PATH $plan.readme) -Raw).ReplaceLineEndings("`n")
          if (-not $readme.Contains("    - Feature 1`n      - Nested detail")) { throw 'Prepared README notes lost nesting.' }
          if (-not (Get-Content $env:BODY_PATH -Raw).Contains('- Feature 1')) { throw 'Missing PR body notes.' }
          if (-not (Get-Content $env:WARNINGS_PATH -Raw).Contains('no tests ran')) { throw 'Unexpected sample warning summary.' }
          $branch = git -C $env:FIXTURE_PATH branch --show-current
          if ($LASTEXITCODE -ne 0 -or $branch -ne 'main') { throw 'Preparation created/switched branches.' }

      - name: Commit prepared sample and create merged PR event
        id: merged
        env:
          FIXTURE_PATH: ${{ steps.fixture.outputs.directory }}
          SAMPLE_PR: ${{ matrix.os == 'windows-latest' && '902' || '901' }}
        run: |
          git -C $env:FIXTURE_PATH add Example.csproj README.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage prepared sample.' }
          git -C $env:FIXTURE_PATH -c user.name=Fixture -c user.email=fixture@example.test commit --quiet -m 'Prepared sample release'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit prepared sample.' }
          $commit = git -C $env:FIXTURE_PATH rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read sample commit.' }
          $event = @{ action = 'closed'; pull_request = @{ number = [int]$env:SAMPLE_PR; merged = $true; merge_commit_sha = $commit; head = @{ ref = 'release/example/1.3.1'; repo = @{ full_name = 'owner/library' } }; base = @{ ref = 'main'; repo = @{ full_name = 'owner/library' } } } }
          $path = Join-Path $env:RUNNER_TEMP ('merged-event-' + [guid]::NewGuid().ToString('N') + '.json')
          $event | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $path -Encoding utf8NoBOM
          "event_path=$path" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Exercise the shared final build action
        id: build
        uses: ./actions/build
        with:
          working-directory: ${{ steps.fixture.outputs.directory }}
          repository: owner/library
          event-path: ${{ steps.merged.outputs.event_path }}

      - name: Verify final package artifact outputs
        env:
          ARTIFACT_ID: ${{ steps.build.outputs.artifact_id }}
          ARTIFACTS_PATH: ${{ steps.build.outputs.artifacts_path }}
          MANIFEST_PATH: ${{ steps.build.outputs.manifest_path }}
          SOURCE_COMMIT: ${{ steps.merged.outputs.commit }}
          BUILD_COMMIT: ${{ steps.build.outputs.commit }}
          SUMMARY_PATH: ${{ steps.build.outputs.summary_path }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_ID) -or $env:BUILD_COMMIT -ne $env:SOURCE_COMMIT) { throw 'Invalid artifact/source outputs.' }
          $manifest = Get-Content $env:MANIFEST_PATH -Raw | ConvertFrom-Json
          if ($manifest.version -ne '1.3.1' -or @($manifest.files).Count -ne 3) { throw 'Final manifest is invalid.' }
          foreach ($file in @($manifest.packageFile, $manifest.symbolFile, 'release-notes.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:ARTIFACTS_PATH $file))) { throw "Missing artifact file $file" }
          }
          if (-not (Get-Content $env:SUMMARY_PATH -Raw).Contains('Publication test warnings')) { throw 'Missing final warning summary.' }
