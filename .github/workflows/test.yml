name: Release script tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Check PowerShell version and script syntax
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion -lt [version]'7.2') { throw 'PowerShell 7.2 or newer is required.' }
          foreach ($file in Get-ChildItem ./scripts -Recurse -Filter '*.ps1' -File) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Test NUnit warning reports
        run: ./scripts/tests/Test-TestWarnings.ps1

      - name: Test release artifacts and recovery
        run: ./scripts/tests/Test-PublishRelease.ps1

      - name: Test HTTP handling
        run: ./scripts/tests/Test-ReleaseHttp.ps1
