name: Release validate
description: Validate release inputs and determine approval requirements

inputs:
  version:
    description: Next stable major.minor.patch version
    required: true
  notes:
    description: Markdown release notes with actual newlines and indentation
    required: true
  package:
    description: Package key; optional for single-package repositories
    default: ''
  override-reason:
    description: Reason for a major release or unusual version jump
    default: ''
  config-path:
    description: Configuration path relative to the library checkout
    default: .github/release-config.json
  selected-ref:
    description: Workflow ref; must match the configured base branch
    default: ${{ github.ref }}
  working-directory:
    description: Library checkout root; defaults to the caller workspace
    default: ${{ github.workspace }}

outputs:
  requires_approval:
    description: Whether the version-approval environment is required (true/false)
    value: ${{ steps.plan.outputs.requires_approval }}
  sdk:
    description: Configured .NET SDK
    value: ${{ steps.plan.outputs.sdk }}
  package:
    description: Selected package key
    value: ${{ steps.plan.outputs.package }}
  package_id:
    description: Selected NuGet package ID
    value: ${{ steps.plan.outputs.package_id }}
  version:
    description: Requested release version
    value: ${{ steps.plan.outputs.version }}
  branch:
    description: Proposed release branch
    value: ${{ steps.plan.outputs.branch }}
  tag:
    description: Proposed release tag
    value: ${{ steps.plan.outputs.tag }}
  base_branch:
    description: Configured main/master branch
    value: ${{ steps.plan.outputs.base_branch }}
  body_path:
    description: Absolute path to the PR-body preview on this runner
    value: ${{ steps.plan.outputs.body_path }}
  plan_path:
    description: Absolute path to the release plan JSON on this runner
    value: ${{ steps.plan.outputs.plan_path }}

runs:
  using: composite
  steps:
    - name: Validate release and show approval preview
      id: plan
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        AUTOMATION_ACTION_PATH: ${{ github.action_path }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_NOTES: ${{ inputs.notes }}
        RELEASE_PACKAGE: ${{ inputs.package }}
        OVERRIDE_REASON: ${{ inputs.override-reason }}
        RELEASE_CONFIG_PATH: ${{ inputs.config-path }}
        SELECTED_REF: ${{ inputs.selected-ref }}
      run: |
        $script = Join-Path $env:AUTOMATION_ACTION_PATH '../../scripts/Validate-Release.ps1'
        $directory = Join-Path $env:RUNNER_TEMP ('release-validation-' + [guid]::NewGuid().ToString('N'))
        & $script -Version $env:RELEASE_VERSION -Notes $env:RELEASE_NOTES -Package $env:RELEASE_PACKAGE -OverrideReason $env:OVERRIDE_REASON -ConfigPath $env:RELEASE_CONFIG_PATH -SelectedRef $env:SELECTED_REF -OutputDirectory $directory
